<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff" />

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Offerwise — System Architecture</text>

  <!-- User -->
  <rect x="420" y="56" width="160" height="46" rx="10" fill="#0f172a" />
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">User (Browser)</text>

  <line x1="500" y1="102" x2="500" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Frontend -->
  <rect x="330" y="134" width="340" height="64" rx="12" fill="#fff7ed" stroke="url(#brand)" stroke-width="2" />
  <text x="500" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Frontend</text>
  <text x="500" y="180" text-anchor="middle" font-size="12" fill="#7c2d12">Next.js 16 · React 19 · Vercel</text>

  <line x1="500" y1="198" x2="500" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="512" y="216" font-size="10.5" fill="#64748b">HTTPS + Firebase ID token</text>

  <!-- Backend -->
  <rect x="290" y="230" width="420" height="64" rx="12" fill="#0f172a" />
  <text x="500" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Backend API</text>
  <text x="500" y="276" text-anchor="middle" font-size="12" fill="#cbd5e1">Express · TypeScript · Render</text>

  <!-- Pipeline strip inside backend area -->
  <line x1="500" y1="294" x2="500" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="120" y="320" width="760" height="112" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="500" y="340" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155" letter-spacing="0.5">ANALYSIS PIPELINE (pipeline.ts)</text>

  <!-- pipeline steps -->
  <g font-size="10.5" fill="#1e293b">
    <rect x="136" y="352" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="190" y="374" text-anchor="middle" font-weight="600">Extract text</text>
    <text x="190" y="390" text-anchor="middle" fill="#64748b">pdf-parse / mammoth</text>

    <rect x="256" y="352" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="310" y="374" text-anchor="middle" font-weight="600">AI extraction</text>
    <text x="310" y="390" text-anchor="middle" fill="#64748b">Gemini → Groq</text>

    <rect x="376" y="352" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="374" text-anchor="middle" font-weight="600">Evidence check</text>
    <text x="430" y="390" text-anchor="middle" fill="#64748b">reject unverifiable</text>

    <rect x="496" y="352" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="550" y="374" text-anchor="middle" font-weight="600">Rules engine</text>
    <text x="550" y="390" text-anchor="middle" fill="#64748b">risk / gap flags</text>

    <rect x="616" y="352" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="670" y="374" text-anchor="middle" font-weight="600">Comparison</text>
    <text x="670" y="390" text-anchor="middle" fill="#64748b">market + company</text>

    <rect x="736" y="352" width="108" height="60" rx="8" fill="#fff7ed" stroke="url(#brand)"/>
    <text x="790" y="374" text-anchor="middle" font-weight="700" fill="#9a3412">Decision Engine</text>
    <text x="790" y="390" text-anchor="middle" fill="#7c2d12">deterministic, no AI call</text>

    <path d="M244,382 L256,382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M364,382 L376,382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M484,382 L496,382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M604,382 L616,382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M724,382 L736,382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrows down to services row -->
  <line x1="310" y1="432" x2="310" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="432" x2="500" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670" y1="432" x2="670" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- External services row -->
  <rect x="60" y="472" width="180" height="70" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" />
  <text x="150" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Firebase Auth</text>
  <text x="150" y="516" text-anchor="middle" font-size="10.5" fill="#4338ca">ID token verification</text>

  <rect x="260" y="472" width="180" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="350" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Gemini + Groq</text>
  <text x="350" y="512" text-anchor="middle" font-size="10.5" fill="#92400e">extraction (Groq = fallback)</text>
  <text x="350" y="528" text-anchor="middle" font-size="10.5" fill="#92400e">never called by Decision Engine</text>

  <rect x="460" y="472" width="180" height="70" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="1.5" />
  <text x="550" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Tavily</text>
  <text x="550" y="516" text-anchor="middle" font-size="10.5" fill="#991b1b">live company research</text>

  <rect x="660" y="472" width="180" height="70" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
  <text x="750" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Adzuna</text>
  <text x="750" y="516" text-anchor="middle" font-size="10.5" fill="#166534">live market salary data</text>

  <!-- Backend to DB -->
  <line x1="500" y1="542" x2="500" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="512" y="564" font-size="10.5" fill="#64748b">persist analysis result</text>

  <rect x="380" y="582" width="240" height="66" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
  <text x="500" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">PostgreSQL</text>
  <text x="500" y="626" text-anchor="middle" font-size="11.5" fill="#334155">via Prisma ORM · Render</text>

  <!-- Response back to frontend (curved) -->
  <path d="M290,262 C 90,262 90,164 328,164" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="66" y="215" text-anchor="middle" font-size="10.5" fill="#94a3b8" transform="rotate(-90 66 215)">JSON report</text>

  <!-- Legend -->
  <text x="500" y="720" text-anchor="middle" font-size="11" fill="#94a3b8">Solid arrows = request/data flow · Dashed = response back to the client · Deployed on Vercel (frontend) + Render (backend &amp; database)</text>
</svg>
